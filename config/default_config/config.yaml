debug: false
prefix: "#agents"

agent:
  trigger: at
  triggerCommand: "#ai"
  isolation:
    enable: true  # 多用户数据隔离（默认开）。true=每个群每个用户完全独立（会话/长期记忆/recall/群历史可见范围）；false=同群完全共享（群体型 bot，会话+记忆+群历史全群共用）。跨群始终隔离；私聊始终按用户。提醒/笔记/人设始终按用户。
  protocol: openai
  preset: deepseek
  baseURL: ""
  apiKey: ""
  model: "deepseek-chat"
  utilityModel: ""  # 进度播报等旁路任务用的小模型 id（留空=沿用主模型；填主 provider 支持的小模型 id 可降本）
  reasoningFields: []
  maxTurns: 50
  temperature: 0.2  # 工具调用稳定性（建议 0.1~0.3；勿设 0 避免复读式回复）
  thinking:
  maxTokens:              # 单次回复最大 token（留空=厂商默认；Anthropic 默认 4096）
  contextWindow:          # 模型上下文窗口 token 数（如 32000）；超 80% 自动压缩历史、保留首条意图
  maxToolResultChars: 8000  # 单条工具结果字符上限（内容获取类工具可经 meta.resultCap 单独放宽到 12000）
  keepReasoning: false      # 是否把推理(reasoning_content)回灌历史（默认 false 省 context）
  stream: false             # 逐字流式输出（依赖适配器、不稳，默认关）
  reflect: auto             # 自我反思/自纠：off=关 | auto=仅多轮/用工具时(默认) | always=每次最终回复都反思
  reflectMaxIterations: 1   # 反思回环修正最大次数（封顶防无限循环）
  progress: true            # 工具调用时推送节流进度消息（消除干等，默认开）
  progressRecall: 3         # 进度消息多少秒后自动撤回（默认 3；适配器不支持则忽略）
  reply:
    mode: image             # 回复渲染：image（markdown→精美浅色图片，默认）/ text（纯文本）；渲染失败自动退文本
    atSender: true          # 群聊回复时艾特发言人（私聊不艾特）
    narrate: true           # 中途播报：模型调工具时附带的思路/进展文本自动转发给用户（OpenClaw 式）
    renderScale: 2          # 回复图片渲染倍率（deviceScaleFactor，2=高清；1=普通；越大越清晰但越耗内存/体积）
  memoryLimits:
  systemPrompt:
  chatPermission: master
  masterSkipConfirm: false   # 主人发起的任务免确认直执行（高危！仅主人；denylist 仍拦）。开启后主人命令不再 #确认，但会发高危提示
  masters: []
  confirmTimeout: 300
  guardAction: flag
  guardSensitivity: medium
  redactSecrets: true          # 发送前脱敏：屏蔽回复中的 API Key/token 等敏感信息（默认开）
  devLog:
    enable: false            # 插件自带详细 trace 日志(框架无关,走 pino 写文件)。true=记录 AI 全链路到 data/agents-plugin/logs/dev.*.log
    dir: ""                  # 日志目录(留空=默认 <yunzai>/data/agents-plugin/logs)
    level: debug             # pino 级别 trace/debug/info/warn/error(debug 捕获全部步骤)
  policy:
    categoryMin:
  media:
    enable: true
    active: true
    passive: true
    maxImages: 4
    maxFileBytes: 8388608
    degrade: note
    caps:
  vision:
    enable: true
    model: ""
    protocol:
    preset:
    baseURL: ""
    apiKey: ""
    maxTokens: 1024
    describePrompt: ""
  tools:
    builtin: true
    dir: "tools"
  miyoushe:
    cookie: ""
    defaultGid: 2
  pixiv:
    enable: false            # Pixiv 功能总开关（需 refreshToken）
    refreshToken: ""         # Pixiv refresh token（用 gppt / pxrepo 等获取；填后 #agents重载）
    imageProxy: "https://i.yuki.sh"   # 图片代理：替换 i.pximg.net（QQ 无 Referer 直连 pximg 显示不了）
    apiProxy: ""             # 可选：app-api 反代地址（留空=直连 app-api.pixiv.net；国内被墙时填反代）
    maxImages: 4             # pixiv_illust 单次最多发图数
  persona:
    dir: ""
  skill:
    builtin: true
    dir: "skills"
    historyCount: 15
  search:
    tavily:
      apiKey: ""
    exa:
      apiKey: ""
    perplexity:
      apiKey: ""
    brave:
      apiKey: ""
    searxng:
      url: ""
    ddg: true
  research:
    permission: master
    maxRounds: 3
    maxConcurrent: 3
    workerModel: ""
    evaluation: true
  mcp:
    requestTimeout: 60000
    servers:
  sticker:
    enable: false            # 表情包总开关（未下载/未开 → 不注入清单、不解析，零影响）
    repo: ""                       # 官方表情包仓库地址（作者维护，用户无需改；留空=尚未接入）
    gitProxy: ""             # git http.proxy（fetch 兜底用，如 http://127.0.0.1:7890）
    githubProxies: []        # 克隆加速代理前缀数组（追加在内置 ghfast.top/gh-proxy.com/ghproxy.net/gitclone.com 之上，安装时测速选最快）
    maxPerReply: 2           # 单条回复最多贴纸数
    cooldown: 300            # 同会话两次带图回复最小间隔（秒）
    sendRate: 0.25           # 概率闸：门控通过后实际带图概率（防每条都带→更 AI）
    antiConsecutive: true    # 防连发：上一条带过则本条不带
    groupOnly: false         # 仅群聊启用
    manifest: ""             # 仓库 manifest 文件名（留空=自动识别根目录第一个合规 .json，含 id/name/tags/docs）
    excludeDirs: []          # 目录黑名单（不复制进 images/）
    excludeKeywords: []      # 文件名关键词黑名单（追加在内置表之上）
    listTopN: 30             # prompt 注入清单条数上限
  calc:
    enable: true            # Python 精确计算工具（数学/统计/大数等，沙箱执行，避免模型心算出错）
    python: "python3"       # python 可执行文件（容器内路径不同可改，如 /usr/sbin/python3）
    timeout: 10             # 单次计算超时（秒，防死循环）
  stt:
    apiBase: ""             # Whisper 兼容 STT API 地址（如 https://api.openai.com/v1/audio/transcriptions）
    apiKey: ""              # STT API Key（OpenAI/Groq/Azure 等）
    model: "whisper-1"     # 模型名
    language: ""            # 语言提示（如 zh/en，留空自动检测）
  terminal:
    # ⚠️ 高危：shell 可执行任意主机命令，防护（allowlist/黑名单/审批）无法 100% 保证安全。
    # enable: true 即表示你知晓风险、同意自担后果，与开发者无关。默认关闭。
    enable: false
    maxTimeout: 600
    blocklist: []
    allowlist: []          # 只读安全命令正则集（空=用默认 ls/cat/grep/git status 等；命中且无重定向时免审批）
